server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${CONTEXT_PATH:/api/v1}

spring:
  application:
    name: localperks
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/localperks?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.localperks.entity

localperks:
  storage:
    image-dir: ${IMAGE_UPLOAD_DIR:./data/images}
  stream:
    key: ${ORDER_STREAM_KEY:stream.orders}
    group: ${ORDER_STREAM_GROUP:order-workers}
    consumer: ${ORDER_STREAM_CONSUMER:consumer-1}

logging:
  level:
    com.localperks: ${APP_LOG_LEVEL:info}
