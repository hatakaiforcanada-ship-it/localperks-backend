services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-localperks}
      MYSQL_USER: ${MYSQL_USERNAME:-localperks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localperks-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localperks-root-dev}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/localperks.sql:/docker-entrypoint-initdb.d/01-localperks.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-localperks-root-dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-localperks}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USERNAME: ${MYSQL_USERNAME:-localperks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localperks-dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      IMAGE_UPLOAD_DIR: /app/data/images
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    ports:
      - "${SERVER_PORT:-8081}:8081"
    volumes:
      - image-data:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  image-data:
