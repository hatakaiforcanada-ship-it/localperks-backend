<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalPerks limited-time offer claim flow</title>
  <desc id="desc">A two-lane diagram showing synchronous Redis admission with Lua and asynchronous MySQL order persistence through Redis Streams.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="syncLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="asyncLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f7fffb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .lane-title { font: 700 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .small { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .edge-label { font: 600 13px 'Segoe UI', Arial, sans-serif; }
      .note { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#page)"/>

  <text x="70" y="65" class="title">Limited-time Offer Claim Flow</text>
  <text x="70" y="96" class="subtitle">Fast Redis admission on the request path, reliable MySQL persistence in the background</text>

  <!-- Synchronous lane -->
  <rect x="55" y="125" width="1490" height="310" rx="24" fill="url(#syncLane)" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="80" y="145" width="238" height="34" rx="17" fill="#dbeafe"/>
  <circle cx="101" cy="162" r="6" fill="#2563eb"/>
  <text x="118" y="168" class="lane-title" fill="#1d4ed8">SYNCHRONOUS ADMISSION</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="95" y="225" width="215" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="135" cy="267" r="17" fill="#e2e8f0"/>
  <circle cx="135" cy="261" r="6" fill="#64748b"/>
  <path d="M124 277 Q135 266 146 277" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="165" y="270" class="node-title">Client</text>
  <text x="120" y="313" class="node-body">Claim an offer</text>
  <text x="120" y="334" class="small">POST /offers/{id}/claim</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="390" y="210" width="255" height="150" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <rect x="414" y="232" width="42" height="42" rx="10" fill="#dbeafe"/>
  <path d="M426 246 H444 M426 253 H444 M426 260 H438" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="470" y="260" class="node-title">Spring Boot API</text>
  <text x="414" y="304" class="node-body">Authenticate user</text>
  <text x="414" y="327" class="node-body">Generate order ID</text>
  <text x="414" y="350" class="node-body">Execute Lua script</text>

  <!-- Lua atomic gate -->
  <g filter="url(#shadow)">
    <rect x="730" y="190" width="360" height="190" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <rect x="754" y="214" width="98" height="28" rx="14" fill="#2563eb"/>
  <text x="803" y="233" text-anchor="middle" style="font:700 12px 'Segoe UI',Arial,sans-serif; fill:#fff; letter-spacing:.7px">ATOMIC</text>
  <text x="754" y="274" class="node-title">Redis Lua gate</text>
  <circle cx="762" cy="305" r="3.5" fill="#2563eb"/>
  <text x="777" y="310" class="node-body">Check available stock</text>
  <circle cx="762" cy="333" r="3.5" fill="#2563eb"/>
  <text x="777" y="338" class="node-body">Reject duplicate user claim</text>
  <circle cx="762" cy="361" r="3.5" fill="#2563eb"/>
  <text x="777" y="366" class="node-body">Reserve stock on acceptance</text>

  <!-- Outcomes -->
  <g filter="url(#shadow)">
    <rect x="1190" y="180" width="280" height="92" rx="18" fill="#fff7f7" stroke="#fecaca"/>
  </g>
  <circle cx="1224" cy="213" r="13" fill="#fee2e2"/>
  <path d="M1218 207 L1230 219 M1230 207 L1218 219" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1250" y="218" class="node-title" fill="#991b1b">Rejected</text>
  <text x="1215" y="250" class="node-body">Out of stock or duplicate claim</text>

  <g filter="url(#shadow)">
    <rect x="1190" y="298" width="280" height="105" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  </g>
  <circle cx="1224" cy="333" r="13" fill="#dcfce7"/>
  <path d="M1217 333 L1222 338 L1232 327" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1250" y="339" class="node-title" fill="#065f46">Accepted</text>
  <text x="1215" y="371" class="node-body">XADD order to Redis Stream</text>
  <text x="1215" y="392" class="small">Return order ID immediately</text>

  <!-- Sync edges -->
  <path d="M310 285 H375" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="342" y="270" text-anchor="middle" class="edge-label" fill="#1d4ed8">request</text>
  <path d="M645 285 H715" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="680" y="270" text-anchor="middle" class="edge-label" fill="#1d4ed8">EVAL</text>
  <path d="M1090 244 H1175" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="1132" y="228" text-anchor="middle" class="edge-label" fill="#b91c1c">reject</text>
  <path d="M1090 329 H1175" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1132" y="313" text-anchor="middle" class="edge-label" fill="#047857">reserve</text>

  <rect x="395" y="390" width="690" height="29" rx="14.5" fill="#ffffff" fill-opacity="0.9" stroke="#dbeafe"/>
  <text x="740" y="410" text-anchor="middle" class="note">The HTTP response waits for Redis only — MySQL is not on the request path.</text>

  <!-- Asynchronous lane -->
  <rect x="55" y="470" width="1490" height="365" rx="24" fill="url(#asyncLane)" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="80" y="490" width="278" height="34" rx="17" fill="#d1fae5"/>
  <circle cx="101" cy="507" r="6" fill="#059669"/>
  <text x="118" y="513" class="lane-title" fill="#047857">ASYNCHRONOUS PERSISTENCE</text>

  <!-- Stream -->
  <g filter="url(#shadow)">
    <rect x="95" y="575" width="230" height="125" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>
  <ellipse cx="132" cy="610" rx="19" ry="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <path d="M113 610 V632 C113 643 151 643 151 632 V610" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <ellipse cx="132" cy="632" rx="19" ry="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="169" y="617" class="node-title">Redis Stream</text>
  <text x="120" y="669" class="node-body">Accepted order messages</text>
  <text x="120" y="691" class="small">consumer group delivery</text>

  <!-- Consumer -->
  <g filter="url(#shadow)">
    <rect x="405" y="575" width="240" height="125" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>
  <rect x="430" y="598" width="38" height="38" rx="9" fill="#d1fae5"/>
  <path d="M438 617 H460 M451 608 L460 617 L451 626" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484" y="623" class="node-title">Order consumer</text>
  <text x="430" y="667" class="node-body">Read with XREADGROUP</text>
  <text x="430" y="689" class="small">process one order message</text>

  <!-- Lock -->
  <g filter="url(#shadow)">
    <rect x="725" y="575" width="235" height="125" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>
  <rect x="750" y="604" width="37" height="33" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <path d="M758 604 V596 C758 582 779 582 779 596 V604" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="806" y="618" class="node-title">Redisson lock</text>
  <text x="750" y="667" class="node-body">Serialize by user ID</text>
  <text x="750" y="689" class="small">release after processing</text>

  <!-- MySQL transaction -->
  <g filter="url(#shadow)">
    <rect x="1040" y="555" width="270" height="165" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  </g>
  <rect x="1065" y="579" width="116" height="28" rx="14" fill="#059669"/>
  <text x="1123" y="598" text-anchor="middle" style="font:700 12px 'Segoe UI',Arial,sans-serif; fill:#fff; letter-spacing:.7px">TRANSACTION</text>
  <text x="1065" y="638" class="node-title">MySQL persistence</text>
  <circle cx="1073" cy="668" r="3.5" fill="#059669"/>
  <text x="1088" y="673" class="node-body">Conditional stock decrement</text>
  <circle cx="1073" cy="696" r="3.5" fill="#059669"/>
  <text x="1088" y="701" class="node-body">Insert order + unique index</text>

  <!-- ACK -->
  <g filter="url(#shadow)">
    <rect x="1385" y="575" width="115" height="125" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <circle cx="1442" cy="617" r="20" fill="#10b981"/>
  <path d="M1432 617 L1439 624 L1452 609" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1442" y="664" text-anchor="middle" class="node-title" fill="#065f46">XACK</text>
  <text x="1442" y="687" text-anchor="middle" class="small">after commit</text>

  <!-- Async edges -->
  <path d="M325 637 H390" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M645 637 H710" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M960 637 H1025" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1310 637 H1370" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1340" y="621" text-anchor="middle" class="edge-label" fill="#047857">commit</text>

  <!-- Sync-to-async handoff -->
  <path d="M1330 403 V455 Q1330 548 1225 548 H220 V560" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowGreen)"/>
  <rect x="713" y="451" width="184" height="28" rx="14" fill="#ccfbf1"/>
  <text x="805" y="470" text-anchor="middle" class="edge-label" fill="#0f766e">Stream handoff</text>

  <!-- Failure and retry -->
  <path d="M1175 720 V772 H525 V715" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <rect x="750" y="754" width="340" height="36" rx="18" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="920" y="778" text-anchor="middle" class="edge-label" fill="#be123c">Failure: no ACK · message stays pending · retry</text>

  <!-- Footer legend -->
  <circle cx="90" cy="868" r="5" fill="#2563eb"/>
  <text x="104" y="873" class="small">request path</text>
  <circle cx="225" cy="868" r="5" fill="#059669"/>
  <text x="239" y="873" class="small">successful persistence</text>
  <circle cx="430" cy="868" r="5" fill="#dc2626"/>
  <text x="444" y="873" class="small">rejection or retry path</text>
  <text x="1510" y="873" text-anchor="end" class="small">LocalPerks Backend</text>
</svg>
